name: agentops

services:
  mysql:
    image: mysql:8.4
    container_name: agentops-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-agentops}
      MYSQL_USER: ${DB_USERNAME:-agentops}
      MYSQL_PASSWORD: ${DB_PASSWORD:-agentops_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-agentops_root_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - agentops-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: agentops-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agentops-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: agentops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-agentops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-agentops_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - agentops-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  agentops-mysql-data:
  agentops-redis-data:
  agentops-rabbitmq-data:
